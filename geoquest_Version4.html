<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoQuest: Territorial GPS Game</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src='https://unpkg.com/@turf/turf@6/turf.min.js'></script>

    <!-- Socket.IO client — loaded from the server -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        #map {
            flex-grow: 1;
            background-color: #e5e7eb;
        }
        .leaflet-marker-icon {
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast.success { background-color: #10b981; }
        .toast.info { background-color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100">

    <div id="map"></div>

    <!-- Main UI Overlay -->
    <div id="overlay" class="fixed bottom-4 left-4 right-4 md:bottom-8 md:left-auto md:right-8 md:w-96 bg-white/95 backdrop-blur-sm p-5 rounded-2xl shadow-2xl text-center z-[1000]">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-2xl font-bold text-gray-800">GeoQuest</h1>
            <div class="text-sm text-gray-500 flex items-center gap-1">
                <span id="connection-dot" style="color:#ef4444; font-size:18px; line-height:1">•</span>
                <span id="connection-label">Offline</span>
            </div>
        </div>

        <!-- Player name -->
        <div class="mb-3">
            <input type="text" id="player-name" placeholder="Your name"
                   class="w-full p-2 border rounded-lg text-center" />
        </div>

        <!-- Session panel -->
        <div id="session-panel" class="mb-3">
            <!-- Pre-join -->
            <div id="pre-join-ui">
                <button id="host-game-btn"
                        class="w-full bg-indigo-500 text-white font-bold py-2 px-4 rounded-full mb-2 hover:bg-indigo-600 transition-colors">
                    Host Game
                </button>
                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="Room code (e.g. AB3F)"
                           class="flex-1 p-2 border rounded-lg text-center uppercase tracking-widest font-mono"
                           maxlength="4" />
                    <button id="join-game-btn"
                            class="bg-amber-500 text-white font-bold py-2 px-4 rounded-full hover:bg-amber-600 transition-colors">
                        Join
                    </button>
                </div>
            </div>

            <!-- In-session (hidden until joined) -->
            <div id="in-session-ui" class="hidden">
                <div class="flex justify-between items-center bg-gray-100 rounded-lg p-2">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-500">Room</span>
                        <span id="room-code-display"
                              class="font-mono font-bold text-indigo-600 text-lg tracking-widest"></span>
                        <span id="host-badge"
                              class="hidden text-xs bg-yellow-400 text-yellow-900 px-1.5 py-0.5 rounded font-bold">HOST</span>
                    </div>
                    <button id="leave-session-btn" class="text-xs text-red-500 hover:underline">Leave</button>
                </div>
                <div id="player-list" class="mt-1 text-xs text-gray-500 flex flex-wrap gap-1"></div>
            </div>
        </div>

        <p id="status" class="text-gray-600 my-2">Join or host a game to play</p>
        <p id="stats" class="text-sm font-medium text-gray-700 mb-4">Captured Territories: 0 | Score: 0</p>

        <button id="toggle-tracking-btn"
                class="w-full bg-green-500 text-white font-bold py-3 px-6 rounded-full text-lg shadow-lg hover:bg-green-600 active:scale-95 transition-all duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
                disabled>
            Start
        </button>

        <button id="generate-lore-btn"
                class="hidden w-full bg-purple-500 text-white font-bold py-3 px-6 rounded-full text-lg shadow-lg hover:bg-purple-600 active:scale-95 transition-all duration-200 ease-in-out mt-3 items-center justify-center">
            <span id="lore-btn-text">✨ Generate Territory Lore</span>
            <div id="lore-btn-spinner" class="spinner hidden"></div>
        </button>

        <div class="mt-3 flex justify-end">
            <button id="reset-btn" class="text-sm text-red-500 hover:underline">Reset My Data</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/50 z-[2000] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl text-center">
            <h2 id="modal-title" class="text-xl font-bold mb-2"></h2>
            <p id="modal-message" class="text-gray-600 mb-6 whitespace-pre-wrap"></p>
            <button id="modal-close-btn"
                    class="bg-blue-500 text-white font-bold py-2 px-8 rounded-full hover:bg-blue-600 transition-colors">
                OK
            </button>
        </div>
    </div>

    <!-- Debug Panel (toggle with 'd') -->
    <div id="debug-panel" class="hidden fixed bottom-4 left-4 p-4 bg-white/90 backdrop-blur-sm rounded-xl shadow-xl z-[1500] w-64">
        <h3 class="font-bold text-gray-800 mb-2">Debug Controls</h3>
        <button id="simulate-btn" class="w-full bg-amber-500 text-white py-2 px-4 rounded mb-2">Simulate Path</button>
        <button id="intercept-btn" class="w-full bg-red-500 text-white py-2 px-4 rounded mb-2">Test Interception</button>
        <div class="text-xs text-gray-500 mt-2">Press 'd' to toggle debug panel</div>
    </div>

    <script>
        // ─── Constants ────────────────────────────────────────────────────────
        const USER_COLOR = '#3498db';
        const TERRITORY_COLOR = 'rgba(52, 152, 219, 0.3)';
        const MIN_TERRITORY_AREA_M2 = 100;
        const JITTER_THRESHOLD_M = 3;
        const PATH_SYNC_INTERVAL_MS = 1000;

        // ─── Map & tracking state ─────────────────────────────────────────────
        let map = null;
        let userMarker = null;
        let currentPathPolyline = null;

        let isTracking = false;
        let watchId = null;
        let pathSyncInterval = null;

        let pathCoordinates = [];
        let territories = [];
        let score = 0;
        let playerName = '';

        // Other players' live paths
        let activePaths = new Map();      // name → [{lat,lng}]
        let activePathLayers = new Map(); // name → L.Polyline

        // ─── Session state ────────────────────────────────────────────────────
        let socket = null;
        let roomCode = null;
        let isHost = false;
        let sessionPlayers = new Map(); // name → {color, score}

        // ─── DOM refs ─────────────────────────────────────────────────────────
        const toggleBtn         = document.getElementById('toggle-tracking-btn');
        const generateLoreBtn   = document.getElementById('generate-lore-btn');
        const loreBtnText       = document.getElementById('lore-btn-text');
        const loreBtnSpinner    = document.getElementById('lore-btn-spinner');
        const statusEl          = document.getElementById('status');
        const statsEl           = document.getElementById('stats');
        const modal             = document.getElementById('modal');
        const modalTitle        = document.getElementById('modal-title');
        const modalMessage      = document.getElementById('modal-message');
        const modalCloseBtn     = document.getElementById('modal-close-btn');
        const playerNameInput   = document.getElementById('player-name');
        const connectionDot     = document.getElementById('connection-dot');
        const connectionLabel   = document.getElementById('connection-label');
        const resetBtn          = document.getElementById('reset-btn');
        const debugPanel        = document.getElementById('debug-panel');
        const simulateBtn       = document.getElementById('simulate-btn');
        const interceptBtn      = document.getElementById('intercept-btn');
        const hostGameBtn       = document.getElementById('host-game-btn');
        const joinGameBtn       = document.getElementById('join-game-btn');
        const roomCodeInput     = document.getElementById('room-code-input');
        const preJoinUI         = document.getElementById('pre-join-ui');
        const inSessionUI       = document.getElementById('in-session-ui');
        const roomCodeDisplay   = document.getElementById('room-code-display');
        const hostBadge         = document.getElementById('host-badge');
        const leaveSessionBtn   = document.getElementById('leave-session-btn');
        const playerListEl      = document.getElementById('player-list');

        // ─── Initialization ───────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            initializeMap();
            initSocket();

            toggleBtn.addEventListener('click', handleToggleTracking);
            generateLoreBtn.addEventListener('click', handleGenerateLore);
            modalCloseBtn.addEventListener('click', () => modal.classList.add('hidden'));
            playerNameInput.addEventListener('change', handlePlayerNameChange);
            resetBtn.addEventListener('click', handleReset);
            hostGameBtn.addEventListener('click', handleHostGame);
            joinGameBtn.addEventListener('click', handleJoinGame);
            leaveSessionBtn.addEventListener('click', handleLeaveSession);
            roomCodeInput.addEventListener('input', () => {
                roomCodeInput.value = roomCodeInput.value.toUpperCase();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'd') debugPanel.classList.toggle('hidden');
            });
            simulateBtn.addEventListener('click', simulatePathCapture);
            interceptBtn.addEventListener('click', simulateInterception);

            updateUI();
        });

        // ─── Local storage ────────────────────────────────────────────────────
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('geoquest_data');
                if (saved) {
                    const data = JSON.parse(saved);
                    score = data.score || 0;
                    playerName = data.playerName || '';
                }
            } catch (e) {
                score = 0;
                playerName = '';
            }
            playerNameInput.value = playerName || generateRandomName();
            if (!playerName) {
                playerName = playerNameInput.value;
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('geoquest_data', JSON.stringify({ score, playerName }));
            } catch (e) {
                console.error('localStorage save failed:', e);
            }
        }

        function generateRandomName() {
            const adj = ['Swift', 'Mighty', 'Clever', 'Brave', 'Silent', 'Mystic'];
            const noun = ['Falcon', 'Wolf', 'Tiger', 'Eagle', 'Panda', 'Fox'];
            return adj[Math.floor(Math.random() * adj.length)] + noun[Math.floor(Math.random() * noun.length)];
        }

        // ─── Map ──────────────────────────────────────────────────────────────
        function initializeMap() {
            map = L.map('map').setView([51.505, -0.09], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            navigator.geolocation.getCurrentPosition(
                ({ coords }) => map.setView([coords.latitude, coords.longitude], 16),
                () => showAlert('Welcome!', 'Could not get initial location. Map is set to a default view.'),
                { enableHighAccuracy: true }
            );
        }

        // ─── Socket.IO ────────────────────────────────────────────────────────
        function initSocket() {
            socket = io();

            socket.on('connect', () => setConnectionStatus(true));
            socket.on('disconnect', () => {
                setConnectionStatus(false);
                showToast('Disconnected from server. Reconnecting...', 5000);
            });

            socket.on('room:joined',        handleRoomJoined);
            socket.on('room:player_joined', handlePlayerJoined);
            socket.on('room:player_left',   handlePlayerLeft);
            socket.on('room:host_changed',  handleHostChanged);
            socket.on('path:updated',       handleRemotePathUpdated);
            socket.on('path:deleted',       handleRemotePathDeleted);
            socket.on('territory:captured', handleRemoteTerritoryCapture);
            socket.on('territory:claim_rejected', handleClaimRejected);
            socket.on('path:intercepted',   handleRemoteInterception);
            socket.on('error',              ({ message }) => showToast(message, 5000));
        }

        // ── Room events ───────────────────────────────────────────────────────
        function handleRoomJoined({ code, roomState, isHost: amHost }) {
            roomCode = code;
            isHost = amHost;

            sessionPlayers.clear();
            for (const p of roomState.players) {
                sessionPlayers.set(p.name, { color: p.color, score: p.score });
            }

            // Render all territories already in the room
            for (const t of roomState.territories) {
                renderTerritory(t);
            }

            // Switch UI panels
            preJoinUI.classList.add('hidden');
            inSessionUI.classList.remove('hidden');
            roomCodeDisplay.textContent = code;
            hostBadge.classList.toggle('hidden', !amHost);

            toggleBtn.disabled = false;
            updatePlayerList();
            updateUI();

            const role = amHost ? 'You are the host.' : 'You joined the session.';
            showToast(`Room ${code} — ${role}`, 4000, 'success');
        }

        function handlePlayerJoined({ player }) {
            sessionPlayers.set(player.name, { color: player.color, score: 0 });
            updatePlayerList();
            showToast(`${player.name} joined the room`, 3000, 'info');
        }

        function handlePlayerLeft({ playerName: name }) {
            sessionPlayers.delete(name);
            updatePlayerList();

            // Remove their path from the map
            removeActivePathFromMap(name);
            activePaths.delete(name);

            showToast(`${name} left the room`, 3000);
        }

        function handleHostChanged({ newHostName }) {
            isHost = (newHostName === playerName);
            hostBadge.classList.toggle('hidden', !isHost);
            showToast(`${newHostName} is now the host`, 4000, 'info');
        }

        // ── Path events ───────────────────────────────────────────────────────
        function handleRemotePathUpdated({ playerName: name, path }) {
            if (name === playerName) return;
            activePaths.set(name, path);
            updateActivePathOnMap(name, path);
        }

        function handleRemotePathDeleted({ playerName: name }) {
            if (name === playerName) return;
            removeActivePathFromMap(name);
            activePaths.delete(name);
        }

        // ── Territory events ──────────────────────────────────────────────────
        function handleRemoteTerritoryCapture({ territory, captorName, points }) {
            if (captorName === playerName) {
                // Our capture was confirmed — update our score with the server-authoritative value
                // (we already rendered it optimistically; just update score if different)
                const existingIdx = territories.findIndex(t => t.id === territory.id);
                if (existingIdx !== -1) {
                    // Already rendered — update score display
                    updateUI();
                }
                showToast(`Territory captured! +${points} points`, 3000, 'success');
            } else {
                // Someone else captured — render it for us
                const exists = territories.some(t => t.id === territory.id);
                if (!exists) {
                    renderTerritory(territory);
                }
                showToast(`${captorName} captured a territory! (+${points} pts)`, 3000, 'info');
            }

            // Update their score in session players
            const sp = sessionPlayers.get(captorName);
            if (sp) {
                sp.score += points;
                updatePlayerList();
            }
        }

        function handleClaimRejected({ reason }) {
            // Roll back the last optimistic territory
            const last = territories[territories.length - 1];
            if (last && last.owner === playerName && last.polygon) {
                map.removeLayer(last.polygon);
                territories.pop();
                // Recalculate score
                const points = Math.max(1, Math.round(last.area / 100));
                score -= points;
                saveToLocalStorage();
                updateUI();
            }
            showToast(`Claim rejected: ${reason}`, 4000);
        }

        function handleRemoteInterception({ interceptorName, victimName }) {
            if (victimName === playerName) {
                pathCoordinates = [];
                if (currentPathPolyline) {
                    map.removeLayer(currentPathPolyline);
                    currentPathPolyline = null;
                }
                showToast(`Your path was intercepted by ${interceptorName}!`, 4000);
            } else if (interceptorName === playerName) {
                score += 10;
                saveToLocalStorage();
                updateUI();
                showToast(`You intercepted ${victimName}'s path! +10 pts`, 3000, 'success');
            } else {
                showToast(`${interceptorName} intercepted ${victimName}'s path!`, 2500, 'info');
            }
        }

        // ─── Session button handlers ──────────────────────────────────────────
        function handleHostGame() {
            playerName = playerNameInput.value.trim() || playerName;
            if (!playerName) { showAlert('Name required', 'Please enter your name before hosting.'); return; }
            playerNameInput.value = playerName;
            saveToLocalStorage();
            socket.emit('room:create', { playerName });
        }

        function handleJoinGame() {
            const code = roomCodeInput.value.trim().toUpperCase();
            playerName = playerNameInput.value.trim() || playerName;
            if (!playerName) { showAlert('Name required', 'Please enter your name before joining.'); return; }
            if (code.length !== 4) { showAlert('Invalid code', 'Enter the 4-character room code.'); return; }
            playerNameInput.value = playerName;
            saveToLocalStorage();
            socket.emit('room:join', { code, playerName });
        }

        function handleLeaveSession() {
            // Disconnect and reconnect to drop the room
            socket.disconnect();
            socket.connect();

            // Reset local session state
            roomCode = null;
            isHost = false;
            sessionPlayers.clear();

            // Clear all remote paths from map
            for (const [name] of activePathLayers.entries()) {
                removeActivePathFromMap(name);
            }
            activePaths.clear();

            preJoinUI.classList.remove('hidden');
            inSessionUI.classList.add('hidden');
            toggleBtn.disabled = true;

            if (isTracking) {
                isTracking = false;
                stopWatchingPosition();
                stopPathSyncing();
            }

            updateUI();
            showToast('Left the room', 2000);
        }

        // ─── Tracking ─────────────────────────────────────────────────────────
        function handleToggleTracking() {
            if (!roomCode) return;

            isTracking = !isTracking;
            updateUI();

            if (isTracking) {
                startWatchingPosition();
                startPathSyncing();
            } else {
                stopWatchingPosition();
                stopPathSyncing();
                socket.emit('path:delete', {});
            }
        }

        function handlePlayerNameChange() {
            const newName = playerNameInput.value.trim();
            if (newName && newName !== playerName) {
                playerName = newName;
                saveToLocalStorage();
            }
        }

        function handleReset() {
            if (!confirm('Reset your territories and score? This cannot be undone.')) return;
            for (const t of territories) {
                if (t.owner === playerName && t.polygon) map.removeLayer(t.polygon);
            }
            territories = territories.filter(t => t.owner !== playerName);
            score = 0;
            saveToLocalStorage();
            updateUI();
        }

        function startWatchingPosition() {
            pathCoordinates = [];
            if (currentPathPolyline) {
                map.removeLayer(currentPathPolyline);
                currentPathPolyline = null;
            }
            generateLoreBtn.classList.add('hidden');

            watchId = navigator.geolocation.watchPosition(
                onLocationSuccess,
                onLocationError,
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function stopWatchingPosition() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        function startPathSyncing() {
            stopPathSyncing();
            syncActivePath();
            pathSyncInterval = setInterval(syncActivePath, PATH_SYNC_INTERVAL_MS);
        }

        function stopPathSyncing() {
            if (pathSyncInterval) {
                clearInterval(pathSyncInterval);
                pathSyncInterval = null;
            }
        }

        function syncActivePath() {
            if (!socket || !roomCode || pathCoordinates.length === 0) return;
            socket.emit('path:update', { path: pathCoordinates });
        }

        function onLocationSuccess(position) {
            const { latitude, longitude } = position.coords;
            const newCoord = { lat: latitude, lng: longitude };

            if (pathCoordinates.length > 0) {
                const last = pathCoordinates[pathCoordinates.length - 1];
                const dist = turf.distance(
                    turf.point([last.lng, last.lat]),
                    turf.point([longitude, latitude]),
                    { units: 'meters' }
                );
                if (dist < JITTER_THRESHOLD_M) return;
            }

            if (pathCoordinates.length === 0) {
                map.setView(newCoord, 18);
            }

            pathCoordinates.push(newCoord);
            updateMapElements(newCoord);

            if (checkForInterception()) return;

            checkForTerritoryCapture(pathCoordinates);
        }

        function onLocationError(error) {
            console.error('Geolocation error:', error.message);
            stopWatchingPosition();
            isTracking = false;
            updateUI();
            showAlert('Location Error', 'Could not get your location. Please enable location services.');
        }

        // ─── Map drawing ──────────────────────────────────────────────────────
        function updateMapElements(coord) {
            if (!userMarker) {
                userMarker = L.marker(coord).addTo(map).bindPopup('You are here!').openPopup();
            } else {
                userMarker.setLatLng(coord);
            }

            if (pathCoordinates.length > 1) {
                if (!currentPathPolyline) {
                    currentPathPolyline = L.polyline(pathCoordinates, { color: USER_COLOR, weight: 5 }).addTo(map);
                } else {
                    currentPathPolyline.setLatLngs(pathCoordinates);
                }
            }
        }

        function updateActivePathOnMap(name, path) {
            const color = getPlayerColor(name);
            let polyline = activePathLayers.get(name);
            if (!polyline) {
                polyline = L.polyline(path, { color, weight: 4, dashArray: '5,10', opacity: 0.7 }).addTo(map);
                activePathLayers.set(name, polyline);
            } else {
                polyline.setLatLngs(path);
            }
        }

        function removeActivePathFromMap(name) {
            const layer = activePathLayers.get(name);
            if (layer) {
                map.removeLayer(layer);
                activePathLayers.delete(name);
            }
        }

        // Shared territory renderer — used for own captures and remote captures
        function renderTerritory(data) {
            const isOwn = data.owner === playerName;
            const color = isOwn ? USER_COLOR : getPlayerColor(data.owner);
            const fillColor = isOwn ? TERRITORY_COLOR : getPlayerColor(data.owner).replace('45%', '75%').replace('hsl', 'hsla').replace(')', ', 0.3)');

            const polygon = L.polygon(data.coords, {
                color,
                fillColor,
                fillOpacity: 0.5,
                weight: 2
            }).addTo(map);

            polygon.on('click', () => {
                const loreText = data.lore ? `\n\nLore: ${data.lore}` : '';
                showAlert(
                    `Territory by ${data.owner}`,
                    `Area: ${Math.round(data.area)} m²${loreText}`
                );
            });

            territories.push({ ...data, polygon });
        }

        // ─── Interception detection ───────────────────────────────────────────
        function checkForInterception() {
            if (pathCoordinates.length < 2) return false;

            for (const [name, path] of activePaths.entries()) {
                if (name === playerName || !path || path.length < 2) continue;

                try {
                    const myLine = turf.lineString(pathCoordinates.map(p => [p.lng, p.lat]));
                    const theirLine = turf.lineString(path.map(p => [p.lng, p.lat]));
                    const intersection = turf.lineIntersect(myLine, theirLine);

                    if (intersection.features.length > 0) {
                        // Notify server — server will confirm and broadcast path:intercepted
                        socket.emit('path:intercept', { targetPlayer: name });
                        return true;
                    }
                } catch (_) { /* ignore malformed paths */ }
            }
            return false;
        }

        // ─── Territory capture ────────────────────────────────────────────────
        function checkForTerritoryCapture(currentPath) {
            if (currentPath.length < 4) return;

            const latest = [currentPath[currentPath.length - 1].lng, currentPath[currentPath.length - 1].lat];
            const prev   = [currentPath[currentPath.length - 2].lng, currentPath[currentPath.length - 2].lat];
            const latestSegment = turf.lineString([prev, latest]);

            for (let i = 0; i < currentPath.length - 3; i++) {
                const seg = turf.lineString([
                    [currentPath[i].lng, currentPath[i].lat],
                    [currentPath[i+1].lng, currentPath[i+1].lat]
                ]);

                const intersection = turf.lineIntersect(latestSegment, seg);
                if (intersection.features.length === 0) continue;

                const intersectionPoint = intersection.features[0].geometry.coordinates;

                const ring = [
                    intersectionPoint,
                    ...currentPath.slice(i + 1).map(p => [p.lng, p.lat]),
                    intersectionPoint
                ];

                const ringWithoutClose = ring.slice(0, -1);
                if (turf.booleanClockwise(ringWithoutClose)) ringWithoutClose.reverse();
                const closedRing = [...ringWithoutClose, ringWithoutClose[0]];

                const turfPolygon = turf.polygon([closedRing]);
                const area = turf.area(turfPolygon);

                if (area < MIN_TERRITORY_AREA_M2) continue;

                const center = turf.centerOfMass(turfPolygon).geometry.coordinates;
                const latLngCoords = closedRing.map(([lng, lat]) => [lat, lng]);

                const id = `territory_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
                const points = Math.max(1, Math.round(area / 100));

                // Optimistic local render
                const territory = {
                    id,
                    coords: latLngCoords,
                    center: [center[1], center[0]],
                    area,
                    owner: playerName,
                    timestamp: new Date().toISOString()
                };
                renderTerritory(territory);

                score += points;
                saveToLocalStorage();
                updateUI();
                generateLoreBtn.classList.remove('hidden');

                // Restart path from intersection point
                pathCoordinates = [{ lat: intersectionPoint[1], lng: intersectionPoint[0] }];
                if (currentPathPolyline) currentPathPolyline.setLatLngs(pathCoordinates);

                // Ask server to validate and broadcast
                socket.emit('territory:claim', {
                    id,
                    coords: latLngCoords,
                    center: territory.center,
                    area
                });

                return;
            }
        }

        // ─── Gemini lore ──────────────────────────────────────────────────────
        async function handleGenerateLore() {
            const lastTerritory = territories
                .filter(t => t.owner === playerName)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];

            if (!lastTerritory) { showAlert('Error', 'No territory captured yet!'); return; }

            setLoreButtonLoading(true);

            const { center, area } = lastTerritory;
            const prompt = `You are a creative historian for a fictional world. A user has just claimed a piece of land. Write a short, imaginative piece of lore (2-3 paragraphs) about this specific location.

Location Coordinates: Latitude ${center[0].toFixed(5)}, Longitude ${center[1].toFixed(5)}
Area: Approximately ${area.toFixed(0)} square meters.

Invent a name for the area, and describe a mythical event, a forgotten ruin, a natural wonder, or a quirky local legend associated with it. Be creative and engaging.`;

            try {
                const lore = await callLoreAPI(prompt, center, area);
                lastTerritory.lore = lore;
                showAlert('Territory Lore', lore);
            } catch (error) {
                console.error('Lore error:', error);
                showAlert('Error', 'Failed to generate lore. Make sure the server has GEMINI_API_KEY set.');
            } finally {
                setLoreButtonLoading(false);
            }
        }

        async function callLoreAPI(prompt, center, area) {
            const response = await fetch('/api/generate-lore', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, center, area, player: playerName })
            });
            if (!response.ok) throw new Error('Server lore request failed');
            const data = await response.json();
            return data.text;
        }

        function setLoreButtonLoading(isLoading) {
            generateLoreBtn.disabled = isLoading;
            loreBtnText.classList.toggle('hidden', isLoading);
            loreBtnSpinner.classList.toggle('hidden', !isLoading);
        }

        // ─── UI helpers ───────────────────────────────────────────────────────
        function updateUI() {
            const inSession = !!roomCode;

            if (isTracking) {
                toggleBtn.textContent = 'Stop';
                toggleBtn.classList.replace('bg-green-500', 'bg-red-500');
                toggleBtn.classList.replace('hover:bg-green-600', 'hover:bg-red-600');
                statusEl.textContent = 'Currently Tracking Your Path...';
            } else {
                toggleBtn.textContent = 'Start';
                toggleBtn.classList.replace('bg-red-500', 'bg-green-500');
                toggleBtn.classList.replace('hover:bg-red-600', 'hover:bg-green-600');
                statusEl.textContent = inSession ? 'Press Start to Begin' : 'Join or host a game to play';
            }

            const myCount = territories.filter(t => t.owner === playerName).length;
            statsEl.textContent = `Captured Territories: ${myCount} | Score: ${score}`;
        }

        function updatePlayerList() {
            playerListEl.innerHTML = '';
            for (const [name, info] of sessionPlayers.entries()) {
                const chip = document.createElement('span');
                chip.className = 'px-2 py-0.5 rounded-full text-white text-xs font-medium';
                chip.style.backgroundColor = info.color;
                chip.textContent = name === playerName ? `${name} (you)` : name;
                playerListEl.appendChild(chip);
            }
        }

        function setConnectionStatus(connected) {
            connectionDot.style.color = connected ? '#10b981' : '#ef4444';
            connectionLabel.textContent = connected ? 'Connected' : 'Offline';
        }

        function showAlert(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        function showToast(message, duration = 3000, type = 'error') {
            document.querySelectorAll('.toast').forEach(t => document.body.removeChild(t));

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { if (toast.parentNode) document.body.removeChild(toast); }, 300);
            }, duration);
        }

        function getPlayerColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return `hsl(${Math.abs(hash) % 360}, 70%, 45%)`;
        }

        // ─── Debug helpers ────────────────────────────────────────────────────
        function simulatePathCapture() {
            const c = map.getCenter();
            const s = 0.0003;
            pathCoordinates = [
                { lat: c.lat - s, lng: c.lng - s },
                { lat: c.lat - s, lng: c.lng + s },
                { lat: c.lat + s, lng: c.lng + s },
                { lat: c.lat + s, lng: c.lng - s },
                { lat: c.lat - s, lng: c.lng - s }
            ];
            if (currentPathPolyline) map.removeLayer(currentPathPolyline);
            currentPathPolyline = L.polyline(pathCoordinates, { color: USER_COLOR, weight: 5 }).addTo(map);
            checkForTerritoryCapture(pathCoordinates);
        }

        function simulateInterception() {
            const fake = 'TestPlayer';
            activePaths.set(fake, pathCoordinates.map(p => ({ lat: p.lat + 0.0001, lng: p.lng })));
            updateActivePathOnMap(fake, activePaths.get(fake));
            // Simulate the server confirming an interception
            handleRemoteInterception({ interceptorName: fake, victimName: playerName });
        }
    </script>

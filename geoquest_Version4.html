<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111316" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F8F9FB" media="(prefers-color-scheme: light)">
    <title>GeoQuest</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <!-- Served by server.js -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        /* ─── Material 3 tokens ─────────────────────────────────────────── */
        :root {
            color-scheme: dark;
            --primary: #A8C7FA;
            --on-primary: #062E6F;
            --secondary-container: #2B3646;
            --on-secondary-container: #D3E3FD;
            --error: #F2B8B5;
            --error-container: #8C1D18;
            --on-error-container: #F9DEDC;
            --success: #6DD58C;
            --warning: #F4C04E;
            --surface-2: #1E2024;
            --surface-3: #2A2D32;
            --on-surface: #E3E3E6;
            --on-surface-variant: #C4C7CF;
            --outline: #8E9199;
            --outline-variant: rgba(255, 255, 255, 0.08);
            --inverse-surface: #E3E3E6;
            --inverse-on-surface: #1E2024;
            --glass: rgba(24, 26, 30, 0.82);
            --glass-strong: rgba(24, 26, 30, 0.92);
            --scrim: rgba(0, 0, 0, 0.55);
            --map-bg: #0E0F11;
            --tile-filter: invert(1) hue-rotate(180deg) grayscale(0.85) brightness(0.85) contrast(0.85);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
            --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --mono: 'Roboto Mono', ui-monospace, monospace;
        }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --primary: #0B57D0;
                --on-primary: #FFFFFF;
                --secondary-container: #DDE6F6;
                --on-secondary-container: #041E49;
                --error: #B3261E;
                --error-container: #F9DEDC;
                --on-error-container: #410E0B;
                --success: #188038;
                --warning: #B06000;
                --surface-2: #F0F2F5;
                --surface-3: #E6E9EE;
                --on-surface: #1B1C1F;
                --on-surface-variant: #4A4D55;
                --outline: #74777F;
                --outline-variant: rgba(0, 0, 0, 0.08);
                --inverse-surface: #2E3133;
                --inverse-on-surface: #F1F0F4;
                --glass: rgba(255, 255, 255, 0.84);
                --glass-strong: rgba(255, 255, 255, 0.94);
                --scrim: rgba(0, 0, 0, 0.32);
                --map-bg: #F5F5F3;
                --tile-filter: grayscale(0.85) contrast(0.95) brightness(1.04);
                --shadow: 0 10px 30px rgba(16, 24, 40, 0.14), 0 2px 8px rgba(16, 24, 40, 0.08);
            }
        }

        /* ─── Base ──────────────────────────────────────────────────────── */
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: var(--font);
            background: var(--map-bg);
            color: var(--on-surface);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        #map { position: fixed; inset: 0; background: var(--map-bg); }
        button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        input { font: inherit; color: inherit; }
        [hidden] { display: none !important; }

        .icon {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            direction: ltr;
            font-feature-settings: 'liga';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .icon.filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        .glass {
            background: var(--glass);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid var(--outline-variant);
            box-shadow: var(--shadow);
        }

        /* State layer: hover / press feedback */
        .state { position: relative; overflow: hidden; isolation: isolate; }
        .state::after {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: -1;
        }
        .state:hover::after { opacity: 0.08; }
        .state:active::after { opacity: 0.14; }
        .state:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* ─── Buttons ───────────────────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 48px;
            padding: 0 24px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: background-color 0.2s, color 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.38; pointer-events: none; }
        .btn-filled { background: var(--primary); color: var(--on-primary); }
        .btn-tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
        .btn-danger { background: var(--error-container); color: var(--on-error-container); }
        .btn-text { color: var(--primary); height: 40px; padding: 0 14px; }
        .btn-block { width: 100%; }
        .btn-lg { height: 56px; border-radius: 28px; font-size: 16px; }
        .btn-lg .icon { font-size: 24px; }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-grid;
            place-items: center;
            color: var(--on-surface-variant);
        }

        /* ─── Text fields (outlined) ────────────────────────────────────── */
        .field { position: relative; flex: 1; min-width: 0; }
        .field input {
            width: 100%;
            height: 56px;
            padding: 20px 16px 6px;
            border-radius: 14px;
            border: 1px solid var(--outline);
            background: transparent;
            outline: none;
            font-size: 16px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field label {
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--on-surface-variant);
            pointer-events: none;
            transition: top 0.15s, font-size 0.15s, color 0.15s;
        }
        .field input:focus { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
        .field input:focus + label,
        .field input:not(:placeholder-shown) + label { top: 15px; font-size: 12px; }
        .field input:focus + label { color: var(--primary); }
        .code-field input { font-family: var(--mono); letter-spacing: 0.3em; text-transform: uppercase; }

        /* ─── Top bar ───────────────────────────────────────────────────── */
        .topbar {
            position: fixed;
            z-index: 1001;
            top: calc(12px + env(safe-area-inset-top));
            left: 12px;
            right: 12px;
            height: 56px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px 0 18px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: auto;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .brand .icon { color: var(--primary); font-size: 22px; }
        .room-chip {
            display: none;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 10px 0 14px;
            border-radius: 18px;
            background: var(--surface-3);
            font-family: var(--mono);
            font-size: 15px;
            letter-spacing: 0.2em;
        }
        .room-chip .icon { font-size: 18px; color: var(--on-surface-variant); }
        .in-session .room-chip { display: inline-flex; }
        .conn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            font-size: 12px;
            color: var(--on-surface-variant);
        }
        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--error);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--error) 22%, transparent);
        }
        .conn.online .conn-dot {
            background: var(--success);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 22%, transparent);
        }
        #leave-session-btn { display: none; }
        .in-session #leave-session-btn { display: inline-grid; }
        @media (max-width: 440px) {
            .in-session #connection-label { display: none; }
        }

        /* ─── Floating action button ────────────────────────────────────── */
        .fabs {
            position: fixed;
            z-index: 1000;
            right: 12px;
            top: calc(80px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .fab {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            color: var(--on-surface-variant);
        }
        .fab.active { color: var(--primary); }
        .fab.active .icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        /* ─── Bottom sheet ──────────────────────────────────────────────── */
        .sheet {
            position: fixed;
            z-index: 1000;
            left: 12px;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom));
            border-radius: 28px;
            padding: 0 20px 14px;
            max-height: calc(100dvh - 120px);
            overflow-y: auto;
            overscroll-behavior: contain;
        }
        .handle { display: flex; justify-content: center; width: 100%; padding: 10px 0 10px; }
        .handle span { width: 32px; height: 4px; border-radius: 2px; background: var(--outline); opacity: 0.5; }
        .headline { margin: 4px 2px 6px; font-size: 22px; font-weight: 400; }
        .supporting { margin: 0 2px 18px; font-size: 14px; line-height: 1.5; color: var(--on-surface-variant); }
        .stack { display: flex; flex-direction: column; gap: 12px; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row .btn { height: 56px; border-radius: 16px; }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 2px 0;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--on-surface-variant);
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--outline-variant); }

        #in-session-ui { display: none; }
        .in-session #in-session-ui { display: block; }
        .in-session #pre-join-ui { display: none; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat { background: var(--surface-2); border-radius: 18px; padding: 12px 14px; }
        .stat-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--on-surface-variant);
        }
        .stat-value {
            margin-top: 4px;
            font-size: 22px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .stat-value small { margin-left: 2px; font-size: 13px; font-weight: 400; color: var(--on-surface-variant); }

        .run-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 4px 12px;
            font-size: 13px;
            color: var(--on-surface-variant);
        }
        .run-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--outline); }
        .run-status[data-state="tracking"] .run-dot { background: var(--success); animation: blink 1.6s ease-in-out infinite; }
        .run-status[data-state="waiting"] .run-dot { background: var(--warning); }
        @keyframes blink { 50% { opacity: 0.3; } }

        #generate-lore-btn { display: none; margin-top: 8px; }
        .can-lore #generate-lore-btn { display: flex; }

        .section-label {
            margin: 18px 4px 4px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--on-surface-variant);
        }
        .players { list-style: none; margin: 0; padding: 0; }
        .player { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 4px; }
        .swatch { flex: none; width: 10px; height: 10px; border-radius: 50%; }
        .player-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
        }
        .host-icon { margin-left: 6px; font-size: 16px; color: var(--warning); vertical-align: -3px; }
        .tag {
            margin-left: 6px;
            padding: 2px 8px;
            border-radius: 8px;
            background: var(--surface-3);
            font-size: 11px;
            font-weight: 500;
            color: var(--on-surface-variant);
        }
        .player-score { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

        .sheet.collapsed .collapsible { display: none; }

        .attrib { margin-top: 12px; text-align: center; font-size: 11px; color: var(--on-surface-variant); opacity: 0.8; }
        .attrib a { color: inherit; }

        @media (min-width: 768px) {
            .topbar { top: 20px; left: 20px; right: 20px; }
            .fabs { top: 92px; right: 20px; }
            .sheet { left: 20px; right: auto; bottom: 20px; width: 380px; }
        }

        /* ─── Snackbar ──────────────────────────────────────────────────── */
        .snackbar {
            position: fixed;
            z-index: 2100;
            left: 50%;
            top: calc(80px + env(safe-area-inset-top));
            transform: translate(-50%, -8px);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            width: max-content;
            max-width: min(520px, calc(100vw - 24px));
            padding: 12px 16px;
            border-radius: 14px;
            background: var(--inverse-surface);
            color: var(--inverse-on-surface);
            font-size: 14px;
            box-shadow: var(--shadow);
            transition: opacity 0.2s, transform 0.2s;
        }
        .snackbar.show { opacity: 1; transform: translate(-50%, 0); }
        @media (min-width: 768px) { .snackbar { top: 92px; } }

        /* ─── Dialog ────────────────────────────────────────────────────── */
        .scrim {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--scrim);
        }
        .dialog {
            width: 100%;
            max-width: 400px;
            padding: 24px 24px 16px;
            border-radius: 28px;
            background: var(--surface-2);
            box-shadow: var(--shadow);
            animation: pop 0.18s ease-out;
        }
        .dialog h2 { margin: 0 0 12px; font-size: 22px; font-weight: 400; }
        .dialog p {
            margin: 0;
            max-height: 50vh;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: var(--on-surface-variant);
            white-space: pre-wrap;
        }
        .dialog-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
        @keyframes pop { from { opacity: 0; transform: scale(0.96); } }

        /* ─── Debug panel ───────────────────────────────────────────────── */
        .debug {
            position: fixed;
            z-index: 1002;
            left: 12px;
            top: calc(80px + env(safe-area-inset-top));
            width: 220px;
            padding: 14px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .debug .btn { height: 40px; font-size: 14px; }
        .debug-title { margin: 0 4px 2px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-surface-variant); }
        @media (min-width: 768px) { .debug { left: 420px; top: 92px; } }

        /* ─── Map markers & layers ──────────────────────────────────────── */
        .leaflet-container { background: var(--map-bg); font-family: var(--font); }
        .leaflet-tile-pane { filter: var(--tile-filter); }
        .marker-icon { background: none; border: 0; }
        .me, .peer { position: absolute; left: 0; top: 0; }
        .me-dot {
            position: absolute;
            left: -9px;
            top: -9px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--c);
            border: 3px solid #fff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45);
        }
        .me-halo {
            position: absolute;
            left: -20px;
            top: -20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--c);
            animation: halo 2.4s ease-out infinite;
        }
        @keyframes halo {
            0% { transform: scale(0.45); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .me-heading {
            position: absolute;
            left: -22px;
            top: -22px;
            width: 44px;
            height: 44px;
            display: none;
            transition: transform 0.3s;
        }
        .me-heading.on { display: block; }
        .me-heading::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 11px solid var(--c);
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
        }
        .peer { transition: opacity 0.3s; }
        .peer.stale { opacity: 0.45; }
        .peer-dot {
            position: absolute;
            left: -7px;
            top: -7px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--c);
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
        .peer-label {
            position: absolute;
            left: 0;
            top: 12px;
            transform: translateX(-50%);
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid var(--outline-variant);
            background: var(--glass-strong);
            color: var(--on-surface);
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }
        .leaflet-interactive.territory-new { animation: claim 1.4s ease-out; }
        @keyframes claim { 0% { fill-opacity: 0.7; } 100% { fill-opacity: 0.22; } }

        @media (prefers-reduced-motion: reduce) {
            .me-halo, .run-status[data-state="tracking"] .run-dot, .leaflet-interactive.territory-new { animation: none; }
        }
    </style>
</head>
<body>

    <div id="map" aria-label="Map"></div>

    <!-- Top app bar -->
    <header class="topbar glass">
        <div class="brand"><span class="icon filled" aria-hidden="true">explore</span>GeoQuest</div>
        <button id="room-chip" class="room-chip state" title="Copy room code" aria-label="Copy room code">
            <span id="room-code-display"></span>
            <span class="icon" aria-hidden="true">content_copy</span>
        </button>
        <div id="conn" class="conn" role="status">
            <span class="conn-dot"></span><span id="connection-label">Offline</span>
        </div>
        <button id="leave-session-btn" class="icon-btn state" title="Leave room" aria-label="Leave room">
            <span class="icon" aria-hidden="true">logout</span>
        </button>
    </header>

    <!-- Map controls -->
    <div class="fabs">
        <button id="recenter-btn" class="fab glass state active" title="Center on me" aria-label="Center on me">
            <span class="icon" aria-hidden="true">my_location</span>
        </button>
    </div>

    <!-- Bottom sheet -->
    <section id="sheet" class="sheet glass">
        <button id="sheet-handle" class="handle" aria-label="Expand or collapse panel"><span></span></button>

        <div id="pre-join-ui">
            <h1 class="headline">Claim your streets</h1>
            <p class="supporting">Walk a loop to capture the ground inside it. Cross a rival's trail to cut it.</p>
            <div class="stack">
                <div class="field">
                    <input id="player-name" type="text" placeholder=" " maxlength="20" autocomplete="nickname" spellcheck="false">
                    <label for="player-name">Your name</label>
                </div>
                <button id="host-game-btn" class="btn btn-filled btn-block state">
                    <span class="icon" aria-hidden="true">add</span>Host a game
                </button>
                <div class="divider">or join</div>
                <div class="row">
                    <div class="field code-field">
                        <input id="room-code-input" type="text" placeholder=" " maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false">
                        <label for="room-code-input">Room code</label>
                    </div>
                    <button id="join-game-btn" class="btn btn-tonal state">Join</button>
                </div>
            </div>
        </div>

        <div id="in-session-ui">
            <div class="stats">
                <div class="stat"><div class="stat-label">Score</div><div id="stat-score" class="stat-value">0</div></div>
                <div class="stat"><div class="stat-label">Area</div><div id="stat-area" class="stat-value">0<small>m²</small></div></div>
                <div class="stat"><div class="stat-label">Trail</div><div id="stat-path" class="stat-value">0<small>m</small></div></div>
            </div>
            <div id="run-status" class="run-status" data-state="idle">
                <span class="run-dot"></span><span id="status">Press start and walk a loop</span>
            </div>
            <button id="toggle-tracking-btn" class="btn btn-filled btn-block btn-lg state"></button>
            <div class="collapsible">
                <button id="generate-lore-btn" class="btn btn-tonal btn-block state">
                    <span class="icon" aria-hidden="true">auto_awesome</span><span id="lore-btn-text">Generate territory lore</span>
                </button>
                <div class="section-label">Players</div>
                <ul id="player-list" class="players"></ul>
            </div>
        </div>

        <div class="attrib">
            © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
        </div>
    </section>

    <!-- Snackbar -->
    <div id="snackbar" class="snackbar" role="status" aria-live="polite">
        <span id="snackbar-icon" class="icon" aria-hidden="true"></span>
        <span id="snackbar-text"></span>
    </div>

    <!-- Dialog -->
    <div id="modal" class="scrim" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <div class="dialog-actions">
                <button id="modal-close-btn" class="btn btn-text state">OK</button>
            </div>
        </div>
    </div>

    <!-- Debug panel (press 'd') -->
    <div id="debug-panel" class="debug glass" hidden>
        <div class="debug-title">Debug</div>
        <button id="simulate-btn" class="btn btn-tonal state">Simulate capture</button>
        <button id="intercept-btn" class="btn btn-tonal state">Test interception</button>
    </div>

    <script>
        // ─── Constants ────────────────────────────────────────────────────────
        // Must match PLAYER_COLORS in server.js
        const PLAYER_COLORS = ['#4C8DF6', '#F28B30', '#1FB5A3', '#E5484D', '#8E6CF0', '#E8B020', '#2BA8E0', '#46B864', '#E25CA8', '#7C8B9E'];
        // Keyless OSM tiles, restyled to a minimal dark/light look via the --tile-filter CSS token
        const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
        const MIN_TERRITORY_AREA_M2 = 100;
        const CLOSE_RADIUS_M = 20;      // coming back this close to your trail closes the loop
        const MIN_LOOP_LENGTH_M = 60;   // ...but only to a part of the trail at least this far back
        const JITTER_THRESHOLD_M = 3;
        const MAX_ACCURACY_M = 50;
        const PATH_SYNC_INTERVAL_MS = 1000;
        const INTERCEPT_RETRY_MS = 2000;

        // ─── Map & tracking state ─────────────────────────────────────────────
        let map = null;
        let tileLayer = null;
        let meMarker = null;
        let accuracyCircle = null;
        let currentPathPolyline = null;
        let currentPathGlow = null;
        let startMarker = null;
        let closingLine = null;
        let loopPreview = null;
        let wakeLock = null;
        let lastFix = null;
        let followMe = true;

        let isTracking = false;
        let watchId = null;
        let pathSyncInterval = null;

        let pathCoordinates = [];
        let territories = [];
        let score = 0;
        let playerName = '';

        let activePaths = new Map();      // name → [{lat,lng}]
        let activePathLayers = new Map(); // name → L.Polyline
        let peerMarkers = new Map();      // name → L.Marker
        let lastInterceptAttempt = new Map();

        // ─── Session state ────────────────────────────────────────────────────
        let socket = null;
        let roomCode = null;
        let isHost = false;
        let hostName = null;
        let sessionPlayers = new Map(); // name → {color, score}

        // Per-tab identity so a reconnecting tab reclaims its seat (and two tabs stay distinct)
        const playerId = getOrCreatePlayerId();

        // ─── DOM refs ─────────────────────────────────────────────────────────
        const $ = id => document.getElementById(id);
        const toggleBtn       = $('toggle-tracking-btn');
        const generateLoreBtn = $('generate-lore-btn');
        const loreBtnText     = $('lore-btn-text');
        const statusEl        = $('status');
        const runStatusEl     = $('run-status');
        const statScore       = $('stat-score');
        const statArea        = $('stat-area');
        const statPath        = $('stat-path');
        const modal           = $('modal');
        const modalTitle      = $('modal-title');
        const modalMessage    = $('modal-message');
        const modalCloseBtn   = $('modal-close-btn');
        const playerNameInput = $('player-name');
        const connEl          = $('conn');
        const connectionLabel = $('connection-label');
        const debugPanel      = $('debug-panel');
        const hostGameBtn     = $('host-game-btn');
        const joinGameBtn     = $('join-game-btn');
        const roomCodeInput   = $('room-code-input');
        const roomChip        = $('room-chip');
        const roomCodeDisplay = $('room-code-display');
        const leaveSessionBtn = $('leave-session-btn');
        const playerListEl    = $('player-list');
        const sheet           = $('sheet');
        const recenterBtn     = $('recenter-btn');
        const snackbar        = $('snackbar');
        const snackbarIcon    = $('snackbar-icon');
        const snackbarText    = $('snackbar-text');

        // ─── Initialization ───────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            loadPlayerName();
            initializeMap();
            initSocket();

            toggleBtn.addEventListener('click', handleToggleTracking);
            generateLoreBtn.addEventListener('click', handleGenerateLore);
            modalCloseBtn.addEventListener('click', closeAlert);
            modal.addEventListener('click', e => { if (e.target === modal) closeAlert(); });
            playerNameInput.addEventListener('change', handlePlayerNameChange);
            hostGameBtn.addEventListener('click', handleHostGame);
            joinGameBtn.addEventListener('click', handleJoinGame);
            leaveSessionBtn.addEventListener('click', handleLeaveSession);
            roomChip.addEventListener('click', copyRoomCode);
            recenterBtn.addEventListener('click', recenter);
            $('sheet-handle').addEventListener('click', () => sheet.classList.toggle('collapsed'));
            roomCodeInput.addEventListener('input', () => {
                roomCodeInput.value = roomCodeInput.value.toUpperCase();
            });
            roomCodeInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') handleJoinGame();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && !modal.hidden) closeAlert();
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'd') debugPanel.hidden = !debugPanel.hidden;
            });
            $('simulate-btn').addEventListener('click', simulatePathCapture);
            $('intercept-btn').addEventListener('click', simulateInterception);

            updateUI();
        });

        function getOrCreatePlayerId() {
            try {
                let id = sessionStorage.getItem('geoquest_player_id');
                if (!id) {
                    id = Math.random().toString(36).slice(2) + Date.now().toString(36);
                    sessionStorage.setItem('geoquest_player_id', id);
                }
                return id;
            } catch (e) {
                return Math.random().toString(36).slice(2) + Date.now().toString(36);
            }
        }

        // ─── Local storage (name only; scores and territories live on the server) ──
        function loadPlayerName() {
            try {
                const saved = JSON.parse(localStorage.getItem('geoquest_data') || '{}');
                playerName = saved.playerName || '';
            } catch (e) {
                playerName = '';
            }
            if (!playerName) {
                playerName = generateRandomName();
                savePlayerName();
            }
            playerNameInput.value = playerName;
        }

        // Per tab, so a reload rejoins the room but a fresh tab starts at the lobby
        function savedRoomCode() {
            try { return sessionStorage.getItem('geoquest_room'); } catch (_) { return null; }
        }

        function saveRoomCode(code) {
            try {
                if (code) sessionStorage.setItem('geoquest_room', code);
                else sessionStorage.removeItem('geoquest_room');
            } catch (_) { /* storage unavailable */ }
        }

        function savePlayerName() {
            try {
                localStorage.setItem('geoquest_data', JSON.stringify({ playerName }));
            } catch (e) {
                console.error('localStorage save failed:', e);
            }
        }

        function generateRandomName() {
            const adj = ['Swift', 'Mighty', 'Clever', 'Brave', 'Silent', 'Mystic'];
            const noun = ['Falcon', 'Wolf', 'Tiger', 'Eagle', 'Panda', 'Fox'];
            return adj[Math.floor(Math.random() * adj.length)] + noun[Math.floor(Math.random() * noun.length)];
        }

        // ─── Map ──────────────────────────────────────────────────────────────
        function initializeMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false, maxZoom: 19 }).setView([51.505, -0.09], 13);
            tileLayer = L.tileLayer(TILE_URL, { maxZoom: 19 }).addTo(map);

            map.on('dragstart', () => setFollow(false));

            if (!window.isSecureContext) {
                showAlert('HTTPS required',
                    'Browsers only allow GPS on https:// pages (or localhost). Open this game through an https link to play on a phone.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                ({ coords }) => {
                    updateFix(coords);
                    map.setView(visibleCenterFor(lastFix, 17), 17);
                },
                () => showToast('Could not get your location yet', 3000, 'info'),
                { enableHighAccuracy: true }
            );
        }

        function setFollow(on) {
            followMe = on;
            recenterBtn.classList.toggle('active', on);
        }

        function recenter() {
            if (!lastFix) {
                showToast('Waiting for your location', 2500, 'info');
                return;
            }
            setFollow(true);
            const zoom = Math.max(map.getZoom(), 17);
            map.flyTo(visibleCenterFor(lastFix, zoom), zoom, { duration: 0.6 });
        }

        // Map center that puts `latlng` in the middle of the area not covered by the top bar and sheet
        function visibleCenterFor(latlng, zoom = map.getZoom()) {
            const W = window.innerWidth;
            const H = window.innerHeight;
            const sheetRect = sheet.getBoundingClientRect();
            const topbarBottom = document.querySelector('.topbar').getBoundingClientRect().bottom;
            const offset = W >= 768
                ? L.point(W / 2 - (sheetRect.right + W) / 2, H / 2 - (topbarBottom + H) / 2)
                : L.point(0, H / 2 - (topbarBottom + sheetRect.top) / 2);
            return map.unproject(map.project(latlng, zoom).add(offset), zoom);
        }

        // ─── Player colors ────────────────────────────────────────────────────
        function hashColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return PLAYER_COLORS[Math.abs(hash) % PLAYER_COLORS.length];
        }

        function getPlayerColor(name) {
            return sessionPlayers.get(name)?.color || hashColor(name);
        }

        const myColor = () => getPlayerColor(playerName);

        // ─── Own marker & trail ───────────────────────────────────────────────
        function buildMeIcon() {
            const el = document.createElement('div');
            el.className = 'me';
            el.style.setProperty('--c', myColor());
            el.innerHTML = '<span class="me-halo"></span><span class="me-heading"></span><span class="me-dot"></span>';
            return L.divIcon({ html: el, className: 'marker-icon', iconSize: [0, 0], iconAnchor: [0, 0] });
        }

        function updateFix({ latitude, longitude, accuracy, heading, speed }) {
            lastFix = { lat: latitude, lng: longitude };
            const ll = [latitude, longitude];

            if (!meMarker) {
                accuracyCircle = L.circle(ll, {
                    radius: accuracy || 0, color: myColor(), weight: 1, opacity: 0.35, fillOpacity: 0.08, interactive: false
                }).addTo(map);
                meMarker = L.marker(ll, { icon: buildMeIcon(), interactive: false, keyboard: false, zIndexOffset: 1000 }).addTo(map);
            } else {
                meMarker.setLatLng(ll);
                accuracyCircle.setLatLng(ll).setRadius(accuracy || 0);
            }

            const headingEl = meMarker.getElement()?.querySelector('.me-heading');
            if (headingEl) {
                const moving = Number.isFinite(heading) && (speed == null || speed > 0.5);
                headingEl.classList.toggle('on', moving);
                if (moving) headingEl.style.transform = `rotate(${heading}deg)`;
            }
        }

        function refreshMyColor() {
            const c = myColor();
            if (meMarker) meMarker.setIcon(buildMeIcon());
            accuracyCircle?.setStyle({ color: c });
            currentPathPolyline?.setStyle({ color: c });
            currentPathGlow?.setStyle({ color: c });
        }

        function drawOwnPath() {
            if (pathCoordinates.length < 2) {
                clearOwnPath();
                return;
            }
            if (!currentPathPolyline) {
                const c = myColor();
                const style = { color: c, lineCap: 'round', lineJoin: 'round', interactive: false };
                currentPathGlow = L.polyline(pathCoordinates, { ...style, weight: 12, opacity: 0.18 }).addTo(map);
                currentPathPolyline = L.polyline(pathCoordinates, { ...style, weight: 4, opacity: 1 }).addTo(map);
            } else {
                currentPathGlow.setLatLngs(pathCoordinates);
                currentPathPolyline.setLatLngs(pathCoordinates);
            }
        }

        function clearOwnPath() {
            if (currentPathPolyline) map.removeLayer(currentPathPolyline);
            if (currentPathGlow) map.removeLayer(currentPathGlow);
            currentPathPolyline = null;
            currentPathGlow = null;
            clearLoopGuide();
        }

        // Start ring, dashed line back to it, and a faint preview of the area the loop would claim
        function updateLoopGuide() {
            if (!isTracking || pathCoordinates.length < 2) {
                clearLoopGuide();
                return;
            }
            const c = myColor();
            const start = pathCoordinates[0];
            const here = pathCoordinates[pathCoordinates.length - 1];

            if (!startMarker) {
                loopPreview = L.polygon(pathCoordinates, { stroke: false, fillColor: c, fillOpacity: 0.08, interactive: false }).addTo(map);
                closingLine = L.polyline([here, start], { color: c, weight: 2, opacity: 0.6, dashArray: '4 8', lineCap: 'round', interactive: false }).addTo(map);
                startMarker = L.circleMarker(start, { radius: 7, color: c, weight: 3, fillColor: c, fillOpacity: 0.25, interactive: false }).addTo(map);
            } else {
                loopPreview.setLatLngs(pathCoordinates);
                closingLine.setLatLngs([here, start]);
                startMarker.setLatLng(start);
            }
        }

        function clearLoopGuide() {
            for (const layer of [startMarker, closingLine, loopPreview]) {
                if (layer) map.removeLayer(layer);
            }
            startMarker = closingLine = loopPreview = null;
        }

        // ─── Other players ────────────────────────────────────────────────────
        function buildPeerIcon(name) {
            const el = document.createElement('div');
            el.className = 'peer';
            el.style.setProperty('--c', getPlayerColor(name));
            const dot = document.createElement('span');
            dot.className = 'peer-dot';
            const label = document.createElement('span');
            label.className = 'peer-label';
            label.textContent = name;
            el.append(dot, label);
            return L.divIcon({ html: el, className: 'marker-icon', iconSize: [0, 0], iconAnchor: [0, 0] });
        }

        function updatePeer(name, path) {
            activePaths.set(name, path);
            if (!path.length) return;

            let polyline = activePathLayers.get(name);
            if (!polyline) {
                polyline = L.polyline(path, {
                    color: getPlayerColor(name), weight: 3, opacity: 0.9, dashArray: '1 8', lineCap: 'round', interactive: false
                }).addTo(map);
                activePathLayers.set(name, polyline);
            } else {
                polyline.setLatLngs(path);
            }

            const last = path[path.length - 1];
            let marker = peerMarkers.get(name);
            if (!marker) {
                marker = L.marker([last.lat, last.lng], { icon: buildPeerIcon(name), interactive: false, keyboard: false, zIndexOffset: 500 }).addTo(map);
                peerMarkers.set(name, marker);
            } else {
                marker.setLatLng([last.lat, last.lng]);
            }
            marker.getElement()?.querySelector('.peer')?.classList.remove('stale');
        }

        // Trail gone (captured, cut, or stopped); keep their last position but dim it
        function clearPeerPath(name) {
            const layer = activePathLayers.get(name);
            if (layer) map.removeLayer(layer);
            activePathLayers.delete(name);
            activePaths.delete(name);
            peerMarkers.get(name)?.getElement()?.querySelector('.peer')?.classList.add('stale');
        }

        function removePeer(name) {
            clearPeerPath(name);
            const marker = peerMarkers.get(name);
            if (marker) map.removeLayer(marker);
            peerMarkers.delete(name);
        }

        function renderTerritory(data, { fresh = false } = {}) {
            const isOwn = data.owner === playerName;
            const color = data.color || getPlayerColor(data.owner);

            const polygon = L.polygon(data.coords, {
                color,
                weight: 2,
                opacity: 0.95,
                fillColor: color,
                fillOpacity: isOwn ? 0.32 : 0.26,
                lineJoin: 'round'
            }).addTo(map);
            if (fresh) polygon.getElement()?.classList.add('territory-new');

            const territory = { ...data, polygon };
            polygon.on('click', () => {
                const loreText = territory.lore ? `\n\n${territory.lore}` : '';
                showAlert(
                    isOwn ? 'Your territory' : `${territory.owner}'s territory`,
                    `${Math.round(territory.area).toLocaleString()} m²${loreText}`
                );
            });

            territories.push(territory);
        }

        // ─── Socket.IO ────────────────────────────────────────────────────────
        function initSocket() {
            socket = io();

            socket.on('connect', () => {
                setConnectionStatus(true);
                // After a network drop or a page reload, reclaim our seat in the room
                const code = roomCode || savedRoomCode();
                if (code) {
                    socket.emit('room:join', { code, playerName, playerId });
                }
            });
            socket.on('disconnect', () => {
                setConnectionStatus(false);
                if (roomCode) showToast('Connection lost. Reconnecting…', 4000);
            });

            socket.on('room:joined',              handleRoomJoined);
            socket.on('room:not_found',           handleRoomNotFound);
            socket.on('room:player_joined',       handlePlayerJoined);
            socket.on('room:player_left',         handlePlayerLeft);
            socket.on('room:host_changed',        handleHostChanged);
            socket.on('path:updated',             handleRemotePathUpdated);
            socket.on('path:deleted',             handleRemotePathDeleted);
            socket.on('territory:captured',       handleTerritoryCaptured);
            socket.on('territory:claim_rejected', ({ reason }) => showToast(`Claim rejected: ${reason}`, 4000));
            socket.on('path:intercepted',         handleRemoteInterception);
            socket.on('error',                    ({ message }) => showToast(message, 5000));
        }

        // ── Room events ───────────────────────────────────────────────────────
        function handleRoomJoined({ code, roomState, isHost: amHost }) {
            const isRejoin = roomCode === code || savedRoomCode() === code;
            clearRoomFromMap();

            roomCode = code;
            saveRoomCode(code);
            isHost = amHost;
            hostName = roomState.hostName;

            sessionPlayers.clear();
            for (const p of roomState.players) {
                sessionPlayers.set(p.name, { color: p.color, score: p.score });
            }
            score = sessionPlayers.get(playerName)?.score || 0;
            refreshMyColor();

            for (const t of roomState.territories) renderTerritory(t);
            for (const { playerName: name, path } of roomState.activePaths) {
                if (name !== playerName) updatePeer(name, path);
            }

            roomCodeDisplay.textContent = code;
            playerNameInput.disabled = true;

            updatePlayerList();
            updateUI();

            if (isRejoin) {
                showToast('Reconnected', 2000, 'success');
                if (isTracking) syncActivePath();
            } else {
                showToast(amHost ? `Room ${code} created. Share the code!` : `Joined room ${code}`, 4000, 'success');
            }
        }

        function handleRoomNotFound({ code }) {
            const closed = roomCode || savedRoomCode();
            if (closed) {
                resetSession();
                showAlert('Room closed', `Room ${closed} no longer exists. Host or join a new game.`);
            } else {
                showToast(`Room "${code}" not found`, 4000);
            }
        }

        function handlePlayerJoined({ player }) {
            sessionPlayers.set(player.name, { color: player.color, score: player.score || 0 });
            updatePlayerList();
            showToast(`${player.name} joined`, 3000, 'info');
        }

        function handlePlayerLeft({ playerName: name }) {
            sessionPlayers.delete(name);
            updatePlayerList();
            removePeer(name);
            showToast(`${name} left`, 3000, 'info');
        }

        function handleHostChanged({ newHostName }) {
            hostName = newHostName;
            isHost = (newHostName === playerName);
            updatePlayerList();
            showToast(isHost ? 'You are now the host' : `${newHostName} is now the host`, 4000, 'info');
        }

        // ── Path events ───────────────────────────────────────────────────────
        function handleRemotePathUpdated({ playerName: name, path }) {
            if (name !== playerName) updatePeer(name, path);
        }

        function handleRemotePathDeleted({ playerName: name }) {
            if (name !== playerName) clearPeerPath(name);
        }

        // ── Territory events ──────────────────────────────────────────────────
        function handleTerritoryCaptured({ territory, captorName, points, removed = [], updated = [], stolen = [], scores = {} }) {
            // Land merged into the new territory, or taken completely
            const gone = new Set(removed);
            for (const t of territories) {
                if (gone.has(t.id) && t.polygon) map.removeLayer(t.polygon);
            }
            territories = territories.filter(t => !gone.has(t.id));

            // Land that lost part of its area to the claim
            for (const change of updated) {
                const t = territories.find(x => x.id === change.id);
                if (!t) continue;
                Object.assign(t, { coords: change.coords, area: change.area, center: change.center });
                t.polygon.setLatLngs(change.coords);
            }

            if (!territories.some(t => t.id === territory.id)) renderTerritory(territory, { fresh: true });

            for (const [name, value] of Object.entries(scores)) {
                const sp = sessionPlayers.get(name);
                if (sp) sp.score = value;
                if (name === playerName) score = value;
            }
            updatePlayerList();

            const lostByMe = stolen.filter(s => s.owner === playerName).reduce((sum, s) => sum + s.area, 0);
            if (captorName === playerName) {
                document.body.classList.add('can-lore');
                const took = stolen.reduce((sum, s) => sum + s.area, 0);
                showToast(took ? `Territory captured · took ${took.toLocaleString()} m² · +${points}` : `Territory captured · +${points}`, 3000, 'success');
            } else if (lostByMe) {
                showToast(`${captorName} took ${lostByMe.toLocaleString()} m² of your land`, 4000);
            } else {
                showToast(`${captorName} captured territory · +${points}`, 3000, 'info');
            }
            updateUI();
        }

        function handleRemoteInterception({ interceptorName, victimName, interceptorScore }) {
            const sp = sessionPlayers.get(interceptorName);
            if (sp) sp.score = interceptorScore;
            updatePlayerList();

            if (victimName === playerName) {
                pathCoordinates = [];
                clearOwnPath();
                updateUI();
                showToast(`${interceptorName} cut your trail`, 4000);
            } else {
                clearPeerPath(victimName);
                if (interceptorName === playerName) {
                    score = interceptorScore;
                    updateUI();
                    showToast(`You cut ${victimName}'s trail · +10`, 3000, 'success');
                } else {
                    showToast(`${interceptorName} cut ${victimName}'s trail`, 2500, 'info');
                }
            }
        }

        // ─── Session actions ──────────────────────────────────────────────────
        function readPlayerName() {
            const name = playerNameInput.value.trim().slice(0, 20);
            if (!name) {
                showAlert('Name required', 'Please enter your name first.');
                return false;
            }
            playerName = name;
            playerNameInput.value = name;
            savePlayerName();
            return true;
        }

        function handleHostGame() {
            if (!socket.connected) { showToast('Not connected to the server yet', 3000); return; }
            if (!readPlayerName()) return;
            socket.emit('room:create', { playerName, playerId });
        }

        function handleJoinGame() {
            if (!socket.connected) { showToast('Not connected to the server yet', 3000); return; }
            const code = roomCodeInput.value.trim().toUpperCase();
            if (code.length !== 4) { showAlert('Invalid code', 'Enter the 4-character room code.'); return; }
            if (!readPlayerName()) return;
            socket.emit('room:join', { code, playerName, playerId });
        }

        function handleLeaveSession() {
            socket.emit('room:leave');
            resetSession();
            showToast('Left the room', 2000, 'info');
        }

        function resetSession() {
            if (isTracking) {
                isTracking = false;
                stopWatchingPosition();
                stopPathSyncing();
            }
            clearRoomFromMap();
            pathCoordinates = [];
            clearOwnPath();
            roomCode = null;
            saveRoomCode(null);
            isHost = false;
            hostName = null;
            score = 0;
            sessionPlayers.clear();
            refreshMyColor();

            document.body.classList.remove('can-lore');
            sheet.classList.remove('collapsed');
            playerNameInput.disabled = false;
            updateUI();
        }

        function clearRoomFromMap() {
            for (const t of territories) {
                if (t.polygon) map.removeLayer(t.polygon);
            }
            territories = [];
            for (const name of new Set([...peerMarkers.keys(), ...activePathLayers.keys()])) removePeer(name);
            activePaths.clear();
        }

        function copyRoomCode() {
            if (!roomCode) return;
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(roomCode)
                    .then(() => showToast(`Room code ${roomCode} copied`, 2000, 'success'))
                    .catch(() => showToast(`Room code: ${roomCode}`, 3000, 'info'));
            } else {
                showToast(`Room code: ${roomCode}`, 3000, 'info');
            }
        }

        // ─── Tracking ─────────────────────────────────────────────────────────
        function handleToggleTracking() {
            if (!roomCode) return;
            if (!window.isSecureContext) {
                showAlert('HTTPS required', 'GPS only works on https:// pages (or localhost).');
                return;
            }

            isTracking = !isTracking;

            if (isTracking) {
                startWatchingPosition();
                startPathSyncing();
                sheet.classList.add('collapsed');
                setFollow(true);
            } else {
                stopWatchingPosition();
                stopPathSyncing();
                socket.emit('path:delete');
                pathCoordinates = [];
                clearOwnPath();
                sheet.classList.remove('collapsed');
            }
            updateUI();
        }

        function handlePlayerNameChange() {
            const newName = playerNameInput.value.trim().slice(0, 20);
            if (newName && newName !== playerName && !roomCode) {
                playerName = newName;
                savePlayerName();
                refreshMyColor();
            }
        }

        function startWatchingPosition() {
            pathCoordinates = [];
            clearOwnPath();
            document.body.classList.remove('can-lore');
            setRunStatus('waiting', 'Finding GPS signal…');
            keepScreenOn(true);

            watchId = navigator.geolocation.watchPosition(
                onLocationSuccess,
                onLocationError,
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function stopWatchingPosition() {
            keepScreenOn(false);
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        function startPathSyncing() {
            stopPathSyncing();
            syncActivePath();
            pathSyncInterval = setInterval(syncActivePath, PATH_SYNC_INTERVAL_MS);
        }

        function stopPathSyncing() {
            if (pathSyncInterval) {
                clearInterval(pathSyncInterval);
                pathSyncInterval = null;
            }
        }

        function syncActivePath() {
            if (!socket || !roomCode || pathCoordinates.length === 0) return;
            socket.emit('path:update', { path: pathCoordinates });
        }

        function onLocationSuccess(position) {
            const coords = position.coords;
            updateFix(coords);

            if (coords.accuracy > MAX_ACCURACY_M) {
                setRunStatus('waiting', 'Weak GPS signal · move into the open');
                return;
            }
            updateRunHint();

            const newCoord = { lat: coords.latitude, lng: coords.longitude };

            if (pathCoordinates.length > 0) {
                const last = pathCoordinates[pathCoordinates.length - 1];
                const dist = turf.distance(
                    turf.point([last.lng, last.lat]),
                    turf.point([newCoord.lng, newCoord.lat]),
                    { units: 'meters' }
                );
                if (dist < JITTER_THRESHOLD_M) return;
            }

            if (followMe) {
                if (pathCoordinates.length === 0) {
                    const zoom = Math.max(map.getZoom(), 18);
                    map.setView(visibleCenterFor(newCoord, zoom), zoom);
                } else {
                    map.panTo(visibleCenterFor(newCoord));
                }
            }

            pathCoordinates.push(newCoord);
            drawOwnPath();
            updatePathStat();

            checkForInterception();
            if (!checkForTerritoryCapture(pathCoordinates)) checkForLoopClosure(pathCoordinates);
            updateLoopGuide();
            updateRunHint();
        }

        function updateRunHint() {
            if (pathCoordinates.length < 2 || trailLengthMeters() < MIN_LOOP_LENGTH_M) {
                setRunStatus('tracking', 'Tracking · walk a loop and come back to your start');
                return;
            }
            const start = pathCoordinates[0];
            const here = pathCoordinates[pathCoordinates.length - 1];
            const meters = turf.distance(turf.point([here.lng, here.lat]), turf.point([start.lng, start.lat]), { units: 'meters' });
            setRunStatus('tracking', `Head back to your start to claim · ${Math.round(meters)} m`);
        }

        async function keepScreenOn(on) {
            try {
                if (on && !wakeLock && 'wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } else if (!on && wakeLock) {
                    await wakeLock.release();
                    wakeLock = null;
                }
            } catch (_) { /* not supported, or denied by battery saver */ }
        }

        // The browser drops the wake lock whenever the page is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isTracking) keepScreenOn(true);
        });

        function onLocationError(error) {
            // Brief GPS dropouts (tunnels, tall buildings) are normal; only give up if permission is denied
            if (error.code !== error.PERMISSION_DENIED) {
                setRunStatus('waiting', 'Waiting for GPS signal…');
                return;
            }
            stopWatchingPosition();
            stopPathSyncing();
            isTracking = false;
            sheet.classList.remove('collapsed');
            updateUI();
            showAlert('Location access needed', 'Allow location access for this site in your browser settings, then press Start again.');
        }

        // ─── Interception detection (server makes the final call) ─────────────
        function checkForInterception() {
            if (pathCoordinates.length < 2) return;

            const myLine = turf.lineString(pathCoordinates.map(p => [p.lng, p.lat]));
            const now = Date.now();

            for (const [name, path] of activePaths.entries()) {
                if (!path || path.length < 2) continue;
                if (now - (lastInterceptAttempt.get(name) || 0) < INTERCEPT_RETRY_MS) continue;

                try {
                    const theirLine = turf.lineString(path.map(p => [p.lng, p.lat]));
                    if (turf.lineIntersect(myLine, theirLine).features.length > 0) {
                        lastInterceptAttempt.set(name, now);
                        socket.emit('path:intercept', { targetPlayer: name, path: pathCoordinates });
                    }
                } catch (_) { /* malformed remote path */ }
            }
        }

        // ─── Territory capture ────────────────────────────────────────────────
        // Asks the server to claim the loop `ring` ([lng,lat] points, open); the new trail starts at `restartPoint`
        function tryClaim(ring, restartPoint) {
            if (ring.length < 3) return false;
            const pts = [...ring];
            if (turf.booleanClockwise([...pts, pts[0]])) pts.reverse();
            const closedRing = [...pts, pts[0]];

            let area;
            try {
                area = turf.area(turf.polygon([closedRing]));
            } catch (_) {
                return false;
            }
            if (area < MIN_TERRITORY_AREA_M2) return false;

            // Server validates, scores and broadcasts territory:captured to everyone
            socket.emit('territory:claim', {
                id: `territory_${Date.now()}_${Math.floor(Math.random() * 100000)}`,
                coords: closedRing.map(([lng, lat]) => [lat, lng]),
                area
            });

            pathCoordinates = [restartPoint];
            drawOwnPath();
            updatePathStat();
            return true;
        }

        // GPS rarely lands exactly on your old trail, so returning near it also closes the loop
        function checkForLoopClosure(path) {
            const n = path.length - 1;
            if (n < 3) return false;

            const toPoint = p => turf.point([p.lng, p.lat]);
            const alongToEnd = new Array(n + 1);
            alongToEnd[n] = 0;
            for (let k = n - 1; k >= 0; k--) {
                alongToEnd[k] = alongToEnd[k + 1] + turf.distance(toPoint(path[k]), toPoint(path[k + 1]), { units: 'meters' });
            }

            const here = toPoint(path[n]);
            for (let j = 0; j < n && alongToEnd[j] >= MIN_LOOP_LENGTH_M; j++) {
                if (turf.distance(here, toPoint(path[j]), { units: 'meters' }) > CLOSE_RADIUS_M) continue;
                const ring = path.slice(j, n + 1).map(p => [p.lng, p.lat]);
                if (tryClaim(ring, path[n])) return true;
            }
            return false;
        }

        function checkForTerritoryCapture(currentPath) {
            if (currentPath.length < 4) return false;

            const latest = [currentPath[currentPath.length - 1].lng, currentPath[currentPath.length - 1].lat];
            const prev   = [currentPath[currentPath.length - 2].lng, currentPath[currentPath.length - 2].lat];
            const latestSegment = turf.lineString([prev, latest]);

            for (let i = 0; i < currentPath.length - 3; i++) {
                const seg = turf.lineString([
                    [currentPath[i].lng, currentPath[i].lat],
                    [currentPath[i + 1].lng, currentPath[i + 1].lat]
                ]);

                const intersection = turf.lineIntersect(latestSegment, seg);
                if (intersection.features.length === 0) continue;

                const intersectionPoint = intersection.features[0].geometry.coordinates;
                // The latest point has already overshot the crossing, so the loop ends at the intersection
                const ring = [
                    intersectionPoint,
                    ...currentPath.slice(i + 1, currentPath.length - 1).map(p => [p.lng, p.lat])
                ];
                if (tryClaim(ring, { lat: intersectionPoint[1], lng: intersectionPoint[0] })) return true;
            }
            return false;
        }

        // ─── Gemini lore ──────────────────────────────────────────────────────
        async function handleGenerateLore() {
            const lastTerritory = territories
                .filter(t => t.owner === playerName)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];

            if (!lastTerritory) { showAlert('No territory yet', 'Capture a territory first.'); return; }

            setLoreButtonLoading(true);

            const { center, area } = lastTerritory;
            const prompt = `You are a creative historian for a fictional world. A user has just claimed a piece of land. Write a short, imaginative piece of lore (2-3 paragraphs) about this specific location.

Location Coordinates: Latitude ${center[0].toFixed(5)}, Longitude ${center[1].toFixed(5)}
Area: Approximately ${area.toFixed(0)} square meters.

Invent a name for the area, and describe a mythical event, a forgotten ruin, a natural wonder, or a quirky local legend associated with it. Be creative and engaging.`;

            try {
                const response = await fetch('/api/generate-lore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Lore request failed');
                lastTerritory.lore = data.text;
                showAlert('Territory lore', data.text);
            } catch (error) {
                console.error('Lore error:', error);
                showAlert('Lore unavailable', error.message);
            } finally {
                setLoreButtonLoading(false);
            }
        }

        function setLoreButtonLoading(isLoading) {
            generateLoreBtn.disabled = isLoading;
            loreBtnText.textContent = isLoading ? 'Writing lore…' : 'Generate territory lore';
        }

        // ─── UI helpers ───────────────────────────────────────────────────────
        function updateUI() {
            document.body.classList.toggle('in-session', !!roomCode);
            document.body.classList.toggle('tracking', isTracking);

            toggleBtn.className = `btn btn-block btn-lg state ${isTracking ? 'btn-danger' : 'btn-filled'}`;
            toggleBtn.innerHTML = isTracking
                ? '<span class="icon filled" aria-hidden="true">stop</span>Stop run'
                : '<span class="icon filled" aria-hidden="true">play_arrow</span>Start run';
            if (!isTracking) setRunStatus('idle', 'Press start and walk a loop');

            statScore.textContent = score.toLocaleString();
            const ownedArea = territories.filter(t => t.owner === playerName).reduce((sum, t) => sum + t.area, 0);
            statArea.innerHTML = ownedArea < 10000
                ? `${Math.round(ownedArea).toLocaleString()}<small>m²</small>`
                : `${(ownedArea / 1000).toFixed(1)}k<small>m²</small>`;
            updatePathStat();
        }

        function trailLengthMeters() {
            return pathCoordinates.length > 1
                ? turf.length(turf.lineString(pathCoordinates.map(p => [p.lng, p.lat])), { units: 'meters' })
                : 0;
        }

        function updatePathStat() {
            const meters = trailLengthMeters();
            statPath.innerHTML = meters < 1000
                ? `${Math.round(meters)}<small>m</small>`
                : `${(meters / 1000).toFixed(1)}<small>km</small>`;
        }

        function setRunStatus(state, text) {
            runStatusEl.dataset.state = state;
            statusEl.textContent = text;
        }

        function updatePlayerList() {
            playerListEl.replaceChildren();
            const sorted = [...sessionPlayers.entries()].sort((a, b) => b[1].score - a[1].score);
            for (const [name, info] of sorted) {
                const li = document.createElement('li');
                li.className = 'player';

                const swatch = document.createElement('span');
                swatch.className = 'swatch';
                swatch.style.background = info.color;

                const nameEl = document.createElement('span');
                nameEl.className = 'player-name';
                nameEl.textContent = name;
                if (name === hostName) {
                    const crown = document.createElement('span');
                    crown.className = 'icon filled host-icon';
                    crown.textContent = 'star';
                    crown.title = 'Host';
                    nameEl.append(crown);
                }
                if (name === playerName) {
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.textContent = 'You';
                    nameEl.append(tag);
                }

                const scoreEl = document.createElement('span');
                scoreEl.className = 'player-score';
                scoreEl.textContent = info.score.toLocaleString();

                li.append(swatch, nameEl, scoreEl);
                playerListEl.append(li);
            }
        }

        function setConnectionStatus(connected) {
            connEl.classList.toggle('online', connected);
            connectionLabel.textContent = connected ? 'Online' : 'Offline';
        }

        function showAlert(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.hidden = false;
            modalCloseBtn.focus();
        }

        function closeAlert() {
            modal.hidden = true;
        }

        let snackTimer = null;
        function showToast(message, duration = 3000, type = 'error') {
            snackbarIcon.textContent = { success: 'check_circle', info: 'info', error: 'error' }[type] || 'info';
            snackbarText.textContent = message;
            snackbar.classList.add('show');
            clearTimeout(snackTimer);
            snackTimer = setTimeout(() => snackbar.classList.remove('show'), duration);
        }

        // ─── Debug helpers ────────────────────────────────────────────────────
        function simulatePathCapture() {
            if (!roomCode) { showToast('Join or host a room first', 3000); return; }
            const c = map.getCenter();
            const s = 0.0003;
            pathCoordinates = [
                { lat: c.lat - s, lng: c.lng - s },
                { lat: c.lat - s, lng: c.lng + s },
                { lat: c.lat + s, lng: c.lng + s },
                { lat: c.lat + s, lng: c.lng - s },
                { lat: c.lat - s * 1.5, lng: c.lng - s * 0.5 }
            ];
            drawOwnPath();
            checkForTerritoryCapture(pathCoordinates);
        }

        function simulateInterception() {
            handleRemoteInterception({ interceptorName: 'TestPlayer', victimName: playerName, interceptorScore: 0 });
        }
    </script>
</body>
</html>
